name: 仓库保活

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 更新最后活跃时间
        run: echo "Last active: $(date)" > last_active.txt
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_active.txt
          git commit -m "chore: 仓库保活" || echo "No changes"
          git push
